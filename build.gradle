plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

repositories {
    mavenLocal()

    // Modrinth Maven for Epic Fight + Epic Fight: Skill Tree
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Epic Fight — hard dependency, the mod is built entirely on its skill/event API.
    // Compile against the full jar (compileOnly so we don't redistribute it).
    compileOnly("maven.modrinth:epic-fight:${project.epicfight_version}")

    // Epic Fight: Skill Tree — only needed to compile the datagen SkillTreeProvider that
    // produces the "passive" skill tree GUI page. Optional at runtime (mods.toml).
    compileOnly("maven.modrinth:epic-fight-skill-tree:${project.epicskills_version}")
}

// Process resources — expand mod metadata placeholders
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) { task ->
    var replaceProperties = [
        minecraft_version   : project.minecraft_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version         : project.neo_version,
        neo_version_range   : project.neo_version_range,
        loader_version_range: project.loader_version_range,
        mod_id              : project.mod_id,
        mod_name            : project.mod_name,
        mod_license         : project.mod_license,
        mod_version         : project.mod_version,
        mod_group_id        : project.mod_group_id,
        mod_authors         : project.mod_authors,
        mod_description     : project.mod_description,
    ]
    task.inputs.properties replaceProperties
    task.expand replaceProperties
    task.from "src/main/templates"
    task.into layout.buildDirectory.dir("generated/modMetadata")
}

sourceSets.main.resources.srcDir generateModMetadata

tasks.withType(ProcessResources).configureEach {
    exclude '**/datagen_cache/**'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
