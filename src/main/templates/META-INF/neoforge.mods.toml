modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "logo.png"
description = '''${mod_description}'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config = "${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "${neo_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

# Epic Fight - hard dependency, the mod is built entirely on its skill/event API.
[[dependencies.${mod_id}]]
    modId = "epicfight"
    type = "required"
    versionRange = "[21,)"
    ordering = "AFTER"
    side = "BOTH"

# Note: Epic Fight: Skill Tree ("epicskills") is deliberately NOT declared here, matching the
# original mod - it is only a compile-time dependency of the DPRSkillTreeProvider/DataEvents
# datagen classes, which are exclusively invoked by the "data" Gradle run (GatherDataEvent).
# They are never touched during normal client/server startup, so no runtime dependency exists.
