# Gradle settings
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Parchment mappings for readable parameter names
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Minecraft / NeoForge versions
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.248
neo_version_range=[21.1.0,)
loader_version_range=[1,)

# Mod properties
mod_id=dodge_parry_reward
mod_name=Dodge Parry Reward
mod_license=All Rights Reserved
mod_version=1.21.1-1.0.0
mod_group_id=com.p1nero.dpr
mod_authors=P1nero
mod_description=Grants a skill book of passive rewards (temporary buffs / instant heal) when the player lands a perfect dodge or perfect parry with Epic Fight. Ported to NeoForge 1.21.1 with the author's permission.

# Epic Fight (hard dependency - the mod is built entirely on its skill/event API)
epicfight_version=21.17.3.1-mc1.21.1-neoforge
# Epic Fight: Skill Tree (optional - only used for the "passive" skill tree GUI page)
epicskills_version=21.3.3-1.21.1
